# .github/workflows/test.yml
name: tests

on:
  push:
  pull_request:

jobs:
  # Unit tests (bats) on every supported distribution. GitHub only hosts Ubuntu
  # runners, so each target runs in its own container.
  bats:
    name: bats (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora 43
            image: fedora:43
          - distro: Fedora 44
            image: fedora:44
          - distro: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - distro: CentOS Stream 10
            image: quay.io/centos/centos:stream10
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
          - distro: Ubuntu 26.04
            image: ubuntu:26.04
    env:
      SKIP_ROOT_CHECK: "1"
    steps:
      # Must run before actions/checkout so that git — and therefore the
      # submodule checkout — is available inside the container.
      - name: Install test dependencies
        run: |
          if command -v dnf >/dev/null 2>&1; then
            # --allowerasing: CentOS Stream ships curl-minimal, which conflicts
            # with the full curl package pulled in here.
            dnf -y install --setopt=install_weak_deps=False --allowerasing \
              bash git curl tar gzip findutils diffutils which procps-ng shadow-utils
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              bash git curl ca-certificates tar gzip findutils diffutils passwd util-linux
          fi

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure executable bits
        run: chmod +x bin/usb-wakeup-blocker.sh test/run-tests.sh

      - name: Init submodules (recursive)
        run: git submodule update --init --recursive

      - name: Show environment
        run: |
          . /etc/os-release && echo "distro: $PRETTY_NAME"
          bash --version | head -n1

      # Steps in a container job run as root, but the suite covers paths that
      # depend on *not* being root (the root check itself, and the "not
      # writable" warning that root bypasses). Run the tests as an
      # unprivileged user instead.
      - name: Create unprivileged test user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Bats tests
        run: runuser -u tester -- env HOME=/home/tester SKIP_ROOT_CHECK=1 ./test/run-tests.sh

  # Coverage runs once, on the host runner, where kcov is easiest to build.
  coverage:
    runs-on: ubuntu-latest
    env:
      SKIP_ROOT_CHECK: "1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Ensure executable bits
        run: chmod +x bin/usb-wakeup-blocker.sh test/run-tests.sh

      - name: Init submodules (recursive)
        run: git submodule update --init --recursive

      - name: Install kcov build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libelf-dev libdw-dev libcurl4-openssl-dev zlib1g-dev

      - name: Build and install kcov
        run: |
          git clone https://github.com/SimonKagstrom/kcov.git
          cd kcov
          mkdir build
          cd build
          cmake ..
          make
          sudo make install

      - name: Run Bats tests with kcov
        run: kcov --include-path=bin/usb-wakeup-blocker.sh --exclude-pattern=test/ --exclude-pattern=/usr/share/kcov/ test_coverage_output ./test/run-tests.sh > test_output.log 2>&1
        continue-on-error: true

      - name: Upload kcov coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kcov-report
          path: test_coverage_output

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test_coverage_output/cobertura.xml # kcov generates cobertura.xml by default
          fail_ci_if_error: true # Optional: Don't fail CI if Codecov upload fails
          verbose: true # Optional: Enable verbose logging for debug

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_output.log

  bats-macos:
    runs-on: macos-latest
    env:
      SKIP_ROOT_CHECK: "1"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install bash 5 via Homebrew
        run: brew install bash

      - name: Init submodules (recursive)
        run: git submodule update --init --recursive

      - name: Run macOS Bats tests
        run: |
          BATS_BIN="test/bats-core/bin/bats"
          if [[ ! -x "$BATS_BIN" ]]; then
            BATS_BIN="$(command -v bats)"
          fi
          "$BATS_BIN" test/test-macos.bats

      - name: Compile IOKit helper
        run: cc -framework IOKit -framework CoreFoundation -o helpers/macos/usb-wakeup-helper helpers/macos/usb-wakeup-helper.c

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          scversion="v0.10.0"
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${scversion}/shellcheck-${scversion}.linux.x86_64.tar.xz" | tar -xJ
          sudo cp "shellcheck-${scversion}/shellcheck" /usr/local/bin/

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck

  # The COPR package is built for Fedora and for EL 9 / EL 10 (RHEL, CentOS
  # Stream, Rocky, AlmaLinux). Build the spec on each of those to catch a
  # macro or dependency that only exists on one family, then install the
  # resulting RPM to check the file layout and the scriptlets.
  rpm:
    name: rpm build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # rpmbuild derives %_topdir from $HOME, which differs between a container
    # job and a local shell. Pin it so both steps agree on where things land.
    env:
      RPM_TOPDIR: /tmp/rpmbuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora 43
            image: fedora:43
          - distro: Fedora 44
            image: fedora:44
          - distro: CentOS Stream 9
            image: quay.io/centos/centos:stream9
          - distro: CentOS Stream 10
            image: quay.io/centos/centos:stream10
    steps:
      # Must run before actions/checkout so that git is available.
      - name: Install build dependencies
        run: |
          dnf -y install --setopt=install_weak_deps=False --allowerasing \
            rpm-build rpmdevtools systemd-rpm-macros git tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Source0 is the GitHub tag tarball, so reproduce its layout from the
      # checkout rather than downloading a published release.
      - name: Build the RPM
        run: |
          set -euo pipefail
          version=$(rpmspec -q --qf '%{version}\n' usb-wakeup-blocker.spec | head -n1)
          mkdir -p "$RPM_TOPDIR/SOURCES" "$RPM_TOPDIR/SPECS"
          git archive --format=tar --prefix="usb-wakeup-blocker-${version}/" HEAD \
            | gzip > "$RPM_TOPDIR/SOURCES/usb-wakeup-blocker-${version}.tar.gz"
          cp usb-wakeup-blocker.spec "$RPM_TOPDIR/SPECS/"
          rpmbuild --define "_topdir $RPM_TOPDIR" -bb "$RPM_TOPDIR/SPECS/usb-wakeup-blocker.spec"

      - name: Install the RPM and check the payload
        run: |
          set -euo pipefail
          rpm=$(find "$RPM_TOPDIR/RPMS" -name '*.rpm' | head -n1)
          echo "built: $rpm"
          # The container images set tsflags=nodocs, which would drop the man
          # page and the license we want to assert on.
          dnf -y install --allowerasing --setopt=tsflags= "$rpm"

          test -x /usr/bin/usb-wakeup-blocker
          # Compatibility symlink for the pre-1.1.2 command name.
          test -L /usr/bin/usb-wakeup-blocker.sh
          test -f /usr/lib/systemd/system/usb-wakeup-blocker.service
          test -f /usr/lib/udev/rules.d/99-usb-wakeup-blocker.rules
          test -f /etc/usb-wakeup-blocker.conf
          test -f /usr/share/man/man1/usb-wakeup-blocker.1.gz
          test -f /usr/share/man/man1/usb-wakeup-blocker.sh.1.gz
          test -f /usr/share/licenses/usb-wakeup-blocker/LICENSE
          test -f /usr/share/bash-completion/completions/usb-wakeup-blocker
          test -f /usr/share/zsh/site-functions/_usb-wakeup-blocker

          SKIP_ROOT_CHECK=1 /usr/bin/usb-wakeup-blocker -h >/dev/null
          SKIP_ROOT_CHECK=1 /usr/bin/usb-wakeup-blocker.sh -h >/dev/null

          # The unit and the udev rule must call the real name, not the symlink.
          grep -q '^ExecStart=/usr/bin/usb-wakeup-blocker ' \
            /usr/lib/systemd/system/usb-wakeup-blocker.service
          grep -q '/usr/bin/usb-wakeup-blocker -p ' \
            /usr/lib/udev/rules.d/99-usb-wakeup-blocker.rules

          dnf -y remove usb-wakeup-blocker
          test ! -e /usr/bin/usb-wakeup-blocker
          test ! -e /usr/bin/usb-wakeup-blocker.sh

  # End-to-end install/uninstall against a real systemd instance, on every
  # supported distribution.
  install-uninstall:
    name: install/uninstall (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora 43
            image: jrei/systemd-fedora:43
          - distro: Fedora 44
            image: jrei/systemd-fedora:44
          - distro: Ubuntu 24.04
            image: jrei/systemd-ubuntu:24.04
          - distro: Ubuntu 26.04
            image: jrei/systemd-ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test install/uninstall in systemd container
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          container_id=$(docker run --detach --rm \
            --privileged \
            --cgroupns=host \
            --tmpfs /run --tmpfs /tmp \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD":/src \
            -w /src \
            "$IMAGE" \
            /sbin/init)

          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Wait for systemd to be ready
          docker exec "$container_id" bash -c "until systemctl is-system-running --quiet || [ \"\$(systemctl is-system-running)\" = \"degraded\" ]; do sleep 1; done"

          docker exec --workdir /src "$container_id" bash -lc '
            set -euo pipefail

            if command -v dnf >/dev/null 2>&1; then
              dnf -y install --setopt=install_weak_deps=False sudo bash-completion usbutils
            else
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y sudo bash-completion usbutils udev
            fi

            chmod +x install.sh uninstall.sh

            sudo ./install.sh

            test -x /usr/bin/usb-wakeup-blocker.sh
            test -f /usr/lib/systemd/system/usb-wakeup-blocker.service
            test -f /usr/share/bash-completion/completions/usb-wakeup-blocker
            test -f /usr/share/zsh/site-functions/_usb-wakeup-blocker
            test -f /etc/usb-wakeup-blocker.conf
            test -f /etc/udev/rules.d/99-usb-wakeup-blocker.rules
            systemctl cat usb-wakeup-blocker.service >/dev/null

            sudo ./uninstall.sh

            test ! -e /usr/bin/usb-wakeup-blocker.sh
            test ! -e /usr/lib/systemd/system/usb-wakeup-blocker.service
            test ! -e /usr/share/bash-completion/completions/usb-wakeup-blocker
            test ! -e /usr/share/zsh/site-functions/_usb-wakeup-blocker
            test ! -e /etc/usb-wakeup-blocker.conf
            test ! -e /etc/udev/rules.d/99-usb-wakeup-blocker.rules
            if systemctl cat usb-wakeup-blocker.service >/dev/null 2>&1; then
              echo "Service still present after uninstall" >&2
              exit 1
            fi
          '
